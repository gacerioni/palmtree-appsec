name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B -q verify

  security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B -q -DskipTests package
      - name: Trivy (dependencies)
        run: |
          docker run --rm -v "$PWD":/src -w /src aquasec/trivy:0.65.0 fs \
            --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --format table .
      - name: Semgrep (code)
        if: ${{ !cancelled() }}
        run: |
          curl -sSfL https://raw.githubusercontent.com/gacerioni/palmtree-appsec/main/rules/palmtree-appsec.yml -o /tmp/palmtree-appsec.yml
          pipx run semgrep scan --config /tmp/palmtree-appsec.yml --config p/java --config p/secrets --severity ERROR --error --metrics=off .
