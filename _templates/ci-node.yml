name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test --if-present

  security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy (dependencies)
        run: |
          docker run --rm -v "$PWD":/src -w /src aquasec/trivy:0.65.0 fs \
            --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --format table .
      - name: Semgrep (code)
        if: ${{ !cancelled() }}
        run: |
          curl -sSfL https://raw.githubusercontent.com/gacerioni/palmtree-appsec/main/rules/palmtree-appsec.yml -o /tmp/palmtree-appsec.yml
          pipx run semgrep scan --config /tmp/palmtree-appsec.yml --config p/typescript --config p/secrets --severity ERROR --error --metrics=off .
